name: Download Docker Image

# 触发条件：当推送主分支，或者手动点击运行时触发
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  download-and-pack:
    runs-on: ubuntu-latest

    steps:
    # 1. 新增步骤：必须先拉取你仓库里的代码（这样 GitHub 才能拿到你的 Dockerfile）
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. 核心修改：不再直接 pull 纯净镜像，而是根据你的 Dockerfile 现场编译出包含扩展的专属镜像
    - name: Build Custom PHP Image
      run: |
        docker build -t php:8.4.21-apache .

    # 3. 将刚刚编译好的定制镜像保存为 tar 归档文件
    - name: Save and Compress Image
      run: |
        docker save php:8.4.21-apache | gzip > php-8.4.21-apache.tar.gz

    # 4. 上传包到 GitHub 的 Artifacts 中
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: php-8.4.21-apache-image
        path: php-8.4.21-apache.tar.gz
        retention-days: 1
